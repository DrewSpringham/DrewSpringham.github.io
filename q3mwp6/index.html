<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">

  <title>Flat finder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px; background: #f5f5f5; color: #212121;
      height: 100vh; display: flex; flex-direction: column;
    }
    header {
      background: white; border-bottom: 1px solid #e0e0e0;
      padding: 12px 20px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    }
    header h1 { font-size: 15px; font-weight: 600; white-space: nowrap; }
    .controls { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; flex: 1; }
    .slider-group { display: flex; align-items: center; gap: 8px; }
    .slider-group label { white-space: nowrap; color: #555; }
    .slider-group .job-name { font-weight: 600; }
    .slider-group input[type=range] { width: 120px; }
    .slider-group .value { min-width: 36px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .divider { width: 1px; height: 24px; background: #e0e0e0; }
    .checkbox-group { display: flex; align-items: center; gap: 6px; white-space: nowrap; color: #555; cursor: pointer; }
    .checkbox-group input[type=checkbox] { cursor: pointer; }
    .toggle-btn {
      padding: 6px 14px; border: 1.5px solid; border-radius: 5px;
      background: white; cursor: pointer;
      font-size: 13px; font-weight: 500; white-space: nowrap;
    }
    #intersection-btn { border-color: #2E7D32; color: #2E7D32; }
    #intersection-btn.active { background: #2E7D32; color: white; }
    #direct-btn { border-color: #6A1B9A; color: #6A1B9A; }
    #direct-btn.active { background: #6A1B9A; color: white; }
    #rightmove-btn { border-color: #00deb6; color: #007a65; }
    #rightmove-btn:hover { background: #00deb6; color: white; }
    #zoopla-btn { border-color: #8c1d82; color: #8c1d82; }
    #zoopla-btn:hover { background: #8c1d82; color: white; }
    #otm-btn { border-color: #e8452c; color: #e8452c; }
    #otm-btn:hover { background: #e8452c; color: white; }
    #meta { font-size: 11px; color: #888; white-space: nowrap; }
    #map { flex: 1; }
  </style>
</head>

// â”€â”€ Property search helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function _encodePolylineVal(v) {
  v = v < 0 ? ~(v << 1) : (v << 1);
  let s = '';
  while (v >= 0x20) { s += String.fromCharCode((0x20 | (v & 0x1f)) + 63); v >>= 5; }
  return s + String.fromCharCode(v + 63);
}

function encodePolyline(coords) {
  let out = '', pLat = 0, pLon = 0;
  for (const [lat, lon] of coords) {
    const iLat = Math.round(lat * 1e5), iLon = Math.round(lon * 1e5);
    out += _encodePolylineVal(iLat - pLat) + _encodePolylineVal(iLon - pLon);
    pLat = iLat; pLon = iLon;
  }
  return out;
}

function computeSearchPolyline() {
  const excludeZone1 = document.getElementById("exclude-zone1").checked;
  const zones = jobs.map((_, i) => computeZone(i, excludeZone1));
  if (!zones[0] || !zones[1]) return null;

  let ix;
  try { ix = turf.intersect(zones[0], zones[1]); } catch (e) { ix = null; }
  if (!ix) return null;

  const simple = turf.simplify(ix, { tolerance: 0.001, highQuality: false });
  let merged;
  if (simple.geometry.type === "Polygon") {
    merged = simple;
  } else {
    const allParts = simple.geometry.coordinates.map(coords => {
      const poly = turf.polygon(coords);
      const c = turf.centroid(poly).geometry.coordinates;
      return { poly, c, area: turf.area(poly) };
    });
    const minRadiusKm = walkRadiusKm(5);
    const minArea = Math.PI * minRadiusKm * minRadiusKm * 1e6; // mÂ²
    const parts = allParts.filter(p => p.area >= minArea);

    // Nearest perimeter points between two polygons
    function perimeterNearest(polyA, polyB) {
      const lineB = turf.polygonToLine(polyB);
      let bestDist = Infinity, bestPtA = null, bestPtB = null;
      for (const coord of polyA.geometry.coordinates[0]) {
        const pt = turf.point(coord);
        const nearest = turf.nearestPointOnLine(lineB, pt);
        if (nearest.properties.dist < bestDist) {
          bestDist = nearest.properties.dist;
          bestPtA = coord;
          bestPtB = nearest.geometry.coordinates;
        }
      }
      return { dist: bestDist, ptA: bestPtA, ptB: bestPtB };
    }

    // Prim's MST using perimeter distances
    const n = parts.length;
    const inMST = new Array(n).fill(false);
    const mstEdges = []; // { i, j, ptA, ptB }
    inMST[0] = true;
    for (let step = 0; step < n - 1; step++) {
      let best = { dist: Infinity, i: -1, j: -1, ptA: null, ptB: null };
      for (let i = 0; i < n; i++) {
        if (!inMST[i]) continue;
        for (let j = 0; j < n; j++) {
          if (inMST[j]) continue;
          const { dist, ptA, ptB } = perimeterNearest(parts[i].poly, parts[j].poly);
          if (dist < best.dist) best = { dist, i, j, ptA, ptB };
        }
      }
      inMST[best.j] = true;
      mstEdges.push(best);
    }

    merged = parts.reduce((acc, p) => turf.union(acc, p.poly), parts[0].poly);
    for (const { ptA, ptB } of mstEdges) {
      const bridge = turf.buffer(
        turf.lineString([ptA, ptB]),
        0.01, { units: "kilometers", steps: 2 }
      );
      merged = turf.union(merged, bridge);
    }
    if (merged.geometry.type !== "Polygon") {
      const biggest = merged.geometry.coordinates.reduce((a, b) => a[0].length > b[0].length ? a : b);
      merged = turf.polygon(biggest);
    }
  }

  const ring = merged.geometry.coordinates[0];
  return encodePolyline(ring.map(([lon, lat]) => [lat, lon]));
}

  if (!polyline) { alert("No intersection to search â€” try wider time limits."); return; }

// â”€â”€ Geometry â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const LONDON_CENTRE = [51.5074, -0.1278];
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371, toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.asin(Math.sqrt(a));
}
function isZone1(st) {
  const zones = st.zones || [];
  if (zones.includes("1")) return true;
  // "NA" = international terminal (no normal fare zone); treat as Zone 1 if close to central London
  if (zones.includes("NA")) {
    return haversineKm(st.lat, st.lon, LONDON_CENTRE[0], LONDON_CENTRE[1]) < 4;
  }
  return false;
}

function computeZone(jobIndex, excludeZone1) {
  let union = null;
  for (const st of stations) {
    if (excludeZone1 && isZone1(st)) continue;
    const j = st.journeys[jobIndex];
    if (!j) continue;
    const mins  = directOnly ? j.direct_mins  : j.total_mins;
    const wmins = directOnly ? j.direct_walk_mins : j.walk_mins;
    if (mins == null || wmins > maxWalk) continue;
    const bufMins = Math.min(maxMins[jobIndex] - mins, maxWalk);
    if (bufMins <= 0) continue;
    const circle = turf.circle(
      [st.lon, st.lat],
      walkRadiusKm(bufMins),
      { steps: 16, units: "kilometers" }
    );
    try {
      union = union ? turf.union(union, circle) : circle;
    } catch (_) { /* skip degenerate geometries */ }
  }
  return union;
}

// â”€â”€ Render â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function render() {
  zoneLayers.forEach(l => map.removeLayer(l));
  zoneLayers = [];
  markerLayer.clearLayers();

  const excludeZone1 = document.getElementById("exclude-zone1").checked;
  const zones = jobs.map((_, i) => computeZone(i, excludeZone1));

  // Per-job zone fills
  if (!intersectionOnly) {
    zones.forEach((zone, i) => {
      if (!zone) return;
      const layer = L.geoJSON(zone, {
        style: {
          color: jobs[i].color, fillColor: jobs[i].color,
          weight: 1.5, fillOpacity: 0.1,
        },
      }).addTo(map);
      zoneLayers.push(layer);
    });
  }

  // Intersection
  if (zones.length >= 2 && zones[0] && zones[1]) {
    try {
      const ix = turf.intersect(zones[0], zones[1]);
      if (ix) {
        const layer = L.geoJSON(ix, {
          style: {
            color: INTERSECTION_COLOR, fillColor: INTERSECTION_COLOR,
            weight: 1.5, fillOpacity: 0.25,
          },
        }).addTo(map);
        zoneLayers.push(layer);
      }
    } catch (e) { console.warn("Intersection error:", e); }
  }

  // Station markers â€” include any station whose point falls inside a zone,
  // even if TfL returned no direct journey from it.
  const pt = (st) => turf.point([st.lon, st.lat]);
  for (const st of stations) {
    if (excludeZone1 && isZone1(st)) continue;

    // Per-job status: "route" (has journey data), "inzone" (geometrically inside), or absent.
    const status = jobs.map((_, i) => {
      const j = st.journeys[i];
      const mins  = j && (directOnly ? j.direct_mins  : j.total_mins);
      const wmins = j && (directOnly ? j.direct_walk_mins : j.walk_mins);
      if (j && mins != null && wmins <= maxWalk && maxMins[i] - mins > 0) return "route";
      if (zones[i] && turf.booleanPointInPolygon(pt(st), zones[i])) return "inzone";
      return null;
    });

    const visible = status.map((s, i) => s ? i : null).filter(i => i !== null);
    if (!visible.length) continue;

    const allJobs = visible.length === jobs.length;
    if (intersectionOnly && !allJobs) continue;

    const hasRoute = status.some(s => s === "route");
    const color = allJobs ? INTERSECTION_COLOR : jobs[visible[0]].color;

    const lines = [`<b>${st.name}</b>`];
    for (const i of visible) {
      if (status[i] === "route") {
        const j = st.journeys[i];
        const mins  = directOnly ? j.direct_mins  : j.total_mins;
        const route = (directOnly ? j.direct_route : j.route_summary) || `${mins} min`;
        lines.push(`<span style="color:${jobs[i].color}">${jobs[i].label}</span>: ${route} (${mins} min)`);
      } else {
        lines.push(`<span style="color:${jobs[i].color}">${jobs[i].label}</span>: within reachable area`);
      }
    }

    L.circleMarker([st.lat, st.lon], {
      radius: 4,
      color,
      fillColor: hasRoute ? color : "white",
      fillOpacity: hasRoute ? 0.8 : 0.5,
      weight: 1.5,
    }).bindTooltip(lines.join("<br>")).addTo(markerLayer);
  }

  // Legend
  if (legendControl) map.removeControl(legendControl);
  legendControl = L.control({ position: "bottomleft" });
  legendControl.onAdd = () => {
    const d = L.DomUtil.create("div");
    d.style.cssText = [
      "background:white", "padding:12px 16px", "border-radius:8px",
      "box-shadow:0 2px 8px rgba(0,0,0,.25)", "font-family:sans-serif",
      "font-size:13px", "line-height:1.8", "max-width:300px",
    ].join(";");
    const rows = jobs.map((j, i) =>
      `<span style="color:${j.color}">&#9632;</span> ${j.label} &mdash; &le; ${maxMins[i]} min`
    ).join("<br>");
    d.innerHTML = `
      <b>Reachability (train + walk only)</b><br>
      ${rows}<br>
      <span style="color:${INTERSECTION_COLOR}">&#9632;</span> Sweet spot &mdash; both within limit<br>
      <span style="color:#888;font-size:11px">
        Tube &middot; Overground &middot; Elizabeth line &middot; National Rail<br>
        Max single walk leg: ${maxWalk} min
      </span>
    `;
    return d;
  };
  legendControl.addTo(map);
}

// â”€â”€ Job location markers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
jobs.forEach(job => {
  const [lat, lon] = job.latlon.split(",").map(Number);
  L.marker([lat, lon], {
    icon: L.divIcon({
      className: "",
      html: `<div style="background:${job.color};color:white;border-radius:50%;width:28px;height:28px;line-height:28px;text-align:center;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.4)">&#128188;</div>`,
      iconSize: [28, 28],
      iconAnchor: [14, 14],
    }),
  }).bindPopup(job.label).addTo(map);
});

render();
</script>
</body>
