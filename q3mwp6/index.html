<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flat finder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
      font-size: 14px; background: #f5f5f5; color: #212121;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    #topbar {
      background: white; border-bottom: 1px solid #e0e0e0;
      padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    #topbar h1 { font-size: 15px; font-weight: 600; flex: 1; }
    #panel-toggle {
      padding: 5px 12px; border: 1.5px solid #bbb; border-radius: 5px;
      background: white; cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    #app { flex: 1; display: flex; overflow: hidden; }

    /* â”€â”€ Left panel â”€â”€ */
    #panel {
      width: 270px; flex-shrink: 0; background: white;
      border-right: 1px solid #e0e0e0;
      display: flex; flex-direction: column; overflow: hidden;
      transition: width 0.2s ease;
    }
    #panel.collapsed { width: 0; border-right: none; }

    #tab-bar {
      display: flex; border-bottom: 1px solid #e0e0e0; flex-shrink: 0; overflow-x: auto;
    }
    .tab-btn {
      flex: 1; min-width: 0; padding: 10px 8px;
      border: none; border-bottom: 2.5px solid transparent;
      background: none; cursor: pointer;
      font-size: 12px; font-weight: 500; color: #888;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn.active { color: var(--c); border-bottom-color: var(--c); }

    #tab-content { flex: 1; overflow-y: auto; padding: 18px 16px; }

    .setting-group { margin-bottom: 20px; }
    .setting-label {
      display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px;
    }
    .setting-label .label-text { font-size: 12px; color: #666; }
    .setting-label .val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; display: block; cursor: pointer; }
    input[type=color] {
      width: 32px; height: 28px; padding: 2px 3px;
      border: 1.5px solid #ddd; border-radius: 5px;
      cursor: pointer; background: none; flex-shrink: 0;
    }

    .checkbox-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: #555; cursor: pointer; user-select: none;
    }
    .checkbox-row input[type=checkbox] { cursor: pointer; }

    .section-divider { border: none; border-top: 1px solid #ebebeb; margin: 18px 0; }

    .toggle-btn {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 9px 12px; margin-bottom: 8px;
      border: 1.5px solid; border-radius: 6px;
      background: white; cursor: pointer;
      font-size: 13px; font-weight: 500; text-align: left;
    }
    .toggle-btn .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: currentColor; opacity: 0.3; transition: opacity 0.15s;
    }
    .toggle-btn.active .dot { opacity: 1; }

    .search-btn {
      display: block; width: 100%; padding: 9px 12px; margin-bottom: 8px;
      border: 1.5px solid; border-radius: 6px;
      background: white; cursor: pointer;
      font-size: 13px; font-weight: 500; text-align: center;
      transition: background 0.15s, color 0.15s;
    }
    #rightmove-btn { border-color: #00deb6; color: #007a65; }
    #rightmove-btn:hover { background: #00deb6; color: white; }
    #zoopla-btn { border-color: #8c1d82; color: #8c1d82; }
    #zoopla-btn:hover { background: #8c1d82; color: white; }
    #otm-btn { border-color: #e8452c; color: #e8452c; }
    #otm-btn:hover { background: #e8452c; color: white; }

    .section-heading { font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: #aaa; margin-bottom: 10px; }
    #meta { font-size: 11px; color: #bbb; margin-top: 6px; }

    #map { flex: 1; }
  </style>
</head>
<body>
<div id="topbar">
  <h1>&#127968; Flat finder</h1>
  <button id="panel-toggle" onclick="togglePanel()">Hide settings</button>
</div>
<div id="app">
  <div id="panel">
    <div id="tab-bar"></div>
    <div id="tab-content"></div>
  </div>
  <div id="map"></div>
</div>

// â”€â”€ Per-person settings â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const personSettings = jobs.map(job => ({
  maxMins: job.max_mins ?? defaults.max_mins,

// â”€â”€ Global visualization settings â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let intersectionOnly = true;
let intersectionColor = "#5E35B1";

const PAYG_PEAK = {
  "1-1":2.80,"1-2":3.60,"1-3":4.20,"1-4":4.70,"1-5":5.30,"1-6":5.60,
  "2-2":1.80,"2-3":2.40,"2-4":3.00,"2-5":3.50,"2-6":3.80,
  "3-3":1.80,"3-4":2.20,"3-5":2.80,"3-6":3.20,
  "4-4":1.80,"4-5":2.20,"4-6":2.60,
  "5-5":1.80,"5-6":2.20,
  "6-6":1.80,
};
let commutesPerWeek = 5;

function walkRadiusKm(bufMins) {
  return bufMins * 60 * defaults.walk_speed_mps / 1000;
}
function quickDistKm(lat1, lon1, lat2, lon2) {
  const dLat = (lat2 - lat1) * 111.12;
  const cosLat = Math.cos((lat1 + lat2) * Math.PI / 360);
  const dLon = (lon2 - lon1) * 111.12 * cosLat;
  return Math.sqrt(dLat * dLat + dLon * dLon);
}
function walkMinsTo(fromLat, fromLon, toLat, toLon) {
  return quickDistKm(fromLat, fromLon, toLat, toLon) * 1000 / (defaults.walk_speed_mps * 60);
}
function monthlyCost(minZone, maxZone) {
  if (!minZone || !maxZone) return null;
  const key = `${minZone}-${maxZone}`;
  const paygSingle = PAYG_PEAK[key];
  if (!paygSingle) return null;
  return Math.round(paygSingle * 2 * commutesPerWeek * 52 / 12);
}
function onCommutesPerWeek(v) {
  commutesPerWeek = Number(v);
  document.getElementById("commutes-val").textContent = v;
  scheduleRender();
}

let activeTab = 0; // 0..jobs.length-1 = person, jobs.length = settings

function buildPanel() {
  const tabBar = document.getElementById("tab-bar");
  // Person tabs
  jobs.forEach((job, i) => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (i === 0 ? " active" : "");
    btn.style.setProperty("--c", job.color);
    btn.textContent = job.label.split(",")[0];
    btn.title = job.label;
    btn.onclick = () => switchTab(i);
    tabBar.appendChild(btn);
  });
  // Settings tab
  const settingsBtn = document.createElement("button");
  settingsBtn.className = "tab-btn";
  settingsBtn.style.setProperty("--c", "#555");
  settingsBtn.textContent = "Settings";
  settingsBtn.onclick = () => switchTab(jobs.length);
  tabBar.appendChild(settingsBtn);

  renderTabContent();
}

function switchTab(index) {
  activeTab = index;
  document.querySelectorAll(".tab-btn").forEach((btn, i) =>
    btn.classList.toggle("active", i === index)
  );
  renderTabContent();
}

      : "";
    content.innerHTML = `

      <div class="setting-group">

        <div style="display:flex;align-items:center;gap:10px">
          <input type="color" id="color-${i}" value="${job.color}" oninput="onColor(${i}, this.value)">

      </div>
      <div class="setting-group">

        <div class="setting-label">
          <span class="label-text">Max zone</span>

// â”€â”€ Property search helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function _encodePolylineVal(v) {
  v = v < 0 ? ~(v << 1) : (v << 1);
  let s = '';
  while (v >= 0x20) { s += String.fromCharCode((0x20 | (v & 0x1f)) + 63); v >>= 5; }
  return s + String.fromCharCode(v + 63);
}
function encodePolyline(coords) {
  let out = '', pLat = 0, pLon = 0;
  for (const [lat, lon] of coords) {
    const iLat = Math.round(lat * 1e5), iLon = Math.round(lon * 1e5);
    out += _encodePolylineVal(iLat - pLat) + _encodePolylineVal(iLon - pLon);
    pLat = iLat; pLon = iLon;
  }
  return out;
}

function computeSearchPolyline() {
  const zones = jobs.map((_, i) => computeZone(i));
  let ix = zones[0] || null;
  for (let i = 1; i < zones.length; i++) {
    if (!ix || !zones[i]) { ix = null; break; }
    try { ix = turf.intersect(ix, zones[i]); } catch (e) { ix = null; break; }
  }
  if (!ix) return null;

  const simple = turf.simplify(ix, { tolerance: 0.001, highQuality: false });
  let merged;
  if (simple.geometry.type === "Polygon") {
    merged = simple;
  } else {
    const allParts = simple.geometry.coordinates.map(coords => {
      const poly = turf.polygon(coords);
      const c = turf.centroid(poly).geometry.coordinates;
      return { poly, c, area: turf.area(poly) };
    });
    const minRadiusKm = walkRadiusKm(5);
    const minArea = Math.PI * minRadiusKm * minRadiusKm * 1e6;
    const parts = allParts.filter(p => p.area >= minArea);

    function perimeterNearest(polyA, polyB) {
      const lineB = turf.polygonToLine(polyB);
      let bestDist = Infinity, bestPtA = null, bestPtB = null;
      for (const coord of polyA.geometry.coordinates[0]) {
        const pt = turf.point(coord);
        const nearest = turf.nearestPointOnLine(lineB, pt);
        if (nearest.properties.dist < bestDist) {
          bestDist = nearest.properties.dist;
          bestPtA = coord;
          bestPtB = nearest.geometry.coordinates;
        }
      }
      return { dist: bestDist, ptA: bestPtA, ptB: bestPtB };
    }

    const n = parts.length;
    const inMST = new Array(n).fill(false);
    const mstEdges = [];
    inMST[0] = true;
    for (let step = 0; step < n - 1; step++) {
      let best = { dist: Infinity, i: -1, j: -1, ptA: null, ptB: null };
      for (let i = 0; i < n; i++) {
        if (!inMST[i]) continue;
        for (let j = 0; j < n; j++) {
          if (inMST[j]) continue;
          const { dist, ptA, ptB } = perimeterNearest(parts[i].poly, parts[j].poly);
          if (dist < best.dist) best = { dist, i, j, ptA, ptB };
        }
      }
      inMST[best.j] = true;
      mstEdges.push(best);
    }

    merged = parts.reduce((acc, p) => turf.union(acc, p.poly), parts[0].poly);
    for (const { ptA, ptB } of mstEdges) {
      const bridge = turf.buffer(turf.lineString([ptA, ptB]), 0.01, { units: "kilometers", steps: 2 });
      merged = turf.union(merged, bridge);
    }
    if (merged.geometry.type !== "Polygon") {
      const biggest = merged.geometry.coordinates.reduce((a, b) => a[0].length > b[0].length ? a : b);
      merged = turf.polygon(biggest);
    }
  }

  const ring = merged.geometry.coordinates[0];
  return encodePolyline(ring.map(([lon, lat]) => [lat, lon]));
}

function openRightmove() {

// â”€â”€ Geometry â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function stationMinZone(st) {
  const nums = (st.zones || []).flatMap(z => z.split('+').map(Number)).filter(n => !isNaN(n));
  return nums.length > 0 ? Math.min(...nums) : 0; // 0 = always include (e.g. NA zones)
}

function computeZoneAtThreshold(jobIndex, threshold) {
  const ps = personSettings[jobIndex];
  let union = null;
  for (const st of stations) {
    if (stationMinZone(st) > ps.maxZone) continue;
    if (ps.nightTube && !st.night_tube) continue;
    const j = st.journeys[jobIndex];
    if (!j) continue;
    const mins  = ps.directOnly ? j.direct_mins  : j.total_mins;
    const wmins = ps.directOnly ? j.direct_walk_mins : j.walk_mins;
    if (mins == null || wmins > ps.maxWalk) continue;
    let bufMins = Math.min(threshold - mins, ps.maxWalk);
    if (ps.nightTube) bufMins = Math.min(bufMins, ps.maxWalkToNightTube);
    if (bufMins <= 0) continue;
    const circle = turf.circle([st.lon, st.lat], walkRadiusKm(bufMins), { steps: 16, units: "kilometers" });
    try { union = union ? turf.union(union, circle) : circle; } catch (_) {}
  }
  return union;
}

function computeZone(jobIndex) {
  return computeZoneAtThreshold(jobIndex, personSettings[jobIndex].maxMins);
}

// â”€â”€ Render â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function render() {
  zoneLayers.forEach(l => map.removeLayer(l));
  zoneLayers = [];
  markerLayer.clearLayers();

  const outsideOffsets = [15, 10, 5];
  const perJobZones = {};
  for (const offset of [...outsideOffsets, 0]) {
    perJobZones[offset] = jobs.map((_, i) =>
      computeZoneAtThreshold(i, personSettings[i].maxMins + offset)
    );
  }

  function sweetSpotAt(offset) {
    let ix = perJobZones[offset][0];
    for (let i = 1; i < jobs.length; i++) {
      if (!ix || !perJobZones[offset][i]) return null;
      try { ix = turf.intersect(ix, perJobZones[offset][i]); } catch (e) { return null; }
    }
    return ix;
  }

  for (const offset of outsideOffsets) {
    const ix = sweetSpotAt(offset);
    if (!ix) continue;
    const layer = L.geoJSON(ix, { style: { fillColor: "#888", fillOpacity: 0.12, stroke: false } }).addTo(map);
    zoneLayers.push(layer);
  }

  const sweetSpot = sweetSpotAt(0);
  if (sweetSpot) {
    const layer = L.geoJSON(sweetSpot, {
      style: { fillColor: intersectionColor, fillOpacity: 0.35, color: intersectionColor, weight: 2.5, opacity: 0.9 },
    }).addTo(map);
    zoneLayers.push(layer);
  }

  const zones = perJobZones[0];

  if (!intersectionOnly) {
    zones.forEach((zone, i) => {
      if (!zone) return;
      const layer = L.geoJSON(zone, { style: { color: jobs[i].color, fillColor: jobs[i].color, fillOpacity: 0.07, weight: 1.5, opacity: 0.5 } }).addTo(map);
      zoneLayers.push(layer);
    });
  }

  const pt = (st) => turf.point([st.lon, st.lat]);
  for (const st of stations) {
    const status = jobs.map((_, i) => {
      const ps = personSettings[i];
      if (stationMinZone(st) > ps.maxZone) return null;
      if (ps.nightTube && !st.night_tube) return null;
      const j = st.journeys[i];
      const mins  = j && (ps.directOnly ? j.direct_mins  : j.total_mins);
      const wmins = j && (ps.directOnly ? j.direct_walk_mins : j.walk_mins);
      if (j && mins != null && wmins <= ps.maxWalk && ps.maxMins - mins > 0) return "route";
      if (zones[i] && turf.booleanPointInPolygon(pt(st), zones[i])) return "inzone";
      return null;
    });

    const visible = status.map((s, i) => s ? i : null).filter(i => i !== null);
    if (!visible.length) continue;
    const allJobs = visible.length === jobs.length;
    if (intersectionOnly && !allJobs) continue;

    const hasRoute = status.some(s => s === "route");
    const color = allJobs ? intersectionColor : jobs[visible[0]].color;

    const lines = [`<b>${st.name}</b>`];
    for (const i of visible) {
      const r = findCoveringStation(st.lat, st.lon, i);
      if (!r) {
        lines.push(`<span style="color:${jobs[i].color}">${jobs[i].label}</span>: within reachable area`);
        continue;
      }
      if (r.direct) {
        const walk = Math.round(r.walkMins);
        const jobShort = r.jobLabel.split(",")[0];
        lines.push(`<span style="color:${jobs[i].color}">${jobs[i].label}</span>: Walk ${walk}m directly to ${jobShort} (${walk} min total)`);
        continue;
      }
      const journeyMins = personSettings[i].directOnly ? r.j.direct_mins : r.j.total_mins;
      const routeSummary = (personSettings[i].directOnly ? r.j.direct_route : r.j.route_summary) || `${journeyMins} min`;
      const walkRounded = Math.round(r.walkMins);
      const total = walkRounded + journeyMins;
      lines.push(`<span style="color:${jobs[i].color}">${jobs[i].label}</span>: Walk ${walkRounded}m to ${cleanName(r.st.name)} â†’ ${routeSummary} (${total} min total)`);
    }
    L.circleMarker([st.lat, st.lon], {
      radius: 4, color, fillColor: hasRoute ? color : "white",
      fillOpacity: hasRoute ? 0.8 : 0.5, weight: 1.5,
    }).bindTooltip(lines.join("<br>")).addTo(markerLayer);
  }

  // Grey markers for stations with no journey data
  const maxMaxZone = Math.max(...personSettings.map(ps => ps.maxZone));
  for (const st of stations) {
    if (stationMinZone(st) > maxMaxZone) continue;
    if (!st.journeys.every(j => !j)) continue;
    L.circleMarker([st.lat, st.lon], {
      radius: 4, color: "#999", fillColor: "white", fillOpacity: 0.9,
      weight: 1.5, dashArray: "3,2",
    }).bindTooltip(`${st.name}<br><i style="color:#999">No route data</i>`).addTo(markerLayer);
  }
}

// â”€â”€ Click-to-route popup â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function cleanName(name) {
  return name
    .replace(/ (Underground|Rail|DLR|Overground|Elizabeth line) Station$/, '')
    .replace(/^London /, '');
}

function findCoveringStation(lat, lng, jobIndex) {
  const ps = personSettings[jobIndex];
  const job = jobs[jobIndex];
  const [jLat, jLon] = job.latlon.split(",").map(Number);
  let bestIn = null, bestInTotal = Infinity;
  let bestAny = null, bestAnyTotal = Infinity;

  // Walking directly to the job is also a candidate. Strict-less-than below means
  // it wins ties against station candidates whose journey is itself just a walk,
  // so we don't end up suggesting "walk to Temple â†’ walk to Bush House".
  const directWalk = walkMinsTo(lat, lng, jLat, jLon);
  if (directWalk <= ps.maxWalk) {
    bestInTotal = directWalk;
    bestIn = { direct: true, walkMins: directWalk, jobLabel: job.label, inZone: true };
    bestAnyTotal = directWalk;
    bestAny = { direct: true, walkMins: directWalk, jobLabel: job.label };
  }

  for (const st of stations) {
    if (stationMinZone(st) > ps.maxZone) continue;
    const j = st.journeys[jobIndex];
    if (!j) continue;
    const mins  = ps.directOnly ? j.direct_mins  : j.total_mins;
    const wmins = ps.directOnly ? j.direct_walk_mins : j.walk_mins;
    if (mins == null || wmins > ps.maxWalk) continue;
    const bufMins = Math.min(ps.maxMins - mins, ps.maxWalk);
    if (bufMins <= 0) continue;
    const walkMins = walkMinsTo(lat, lng, st.lat, st.lon);
    const total = walkMins + mins;
    const distKm = quickDistKm(lat, lng, st.lat, st.lon);
    if (total < bestAnyTotal) { bestAnyTotal = total; bestAny = { st, j, walkKm: distKm, walkMins }; }
    if (walkMins <= bufMins && total < bestInTotal) {
      bestInTotal = total; bestIn = { st, j, walkKm: distKm, walkMins, inZone: true };
    }
  }
  return bestIn || (bestAny ? { ...bestAny, inZone: false } : null);
}

function buildClickPopup(latlng) {
  const clickPt = turf.point([latlng.lng, latlng.lat]);
  const nearestNoData = stations.reduce((best, st) => {
    if (!st.journeys.every(j => !j)) return best;
    const d = turf.distance(clickPt, turf.point([st.lon, st.lat]), { units: "kilometers" });
    return d < best.dist ? { st, dist: d } : best;
  }, { st: null, dist: Infinity });

  let html = '<div style="font-size:13px;line-height:1.5;min-width:230px">';
  for (let i = 0; i < jobs.length; i++) {
    const r = findCoveringStation(latlng.lat, latlng.lng, i);
    html += `<div style="margin-bottom:10px;padding-left:8px;border-left:3px solid ${jobs[i].color}">`;
    html += `<div style="font-weight:600;color:${jobs[i].color};margin-bottom:3px">${jobs[i].label}</div>`;
    if (!r) {
      html += `<div style="color:#888;font-size:12px">No data</div>`;
    } else if (r.direct) {
      const walk = Math.max(1, Math.round(r.walkMins));
      const jobShort = r.jobLabel.split(",")[0];
      html += `<div style="color:#555;font-size:12px">Walk ~${walk} min directly to ${jobShort}</div>`;
      html += `<div style="color:#333;font-size:12px;font-weight:600;margin-top:4px">~${walk} min total</div>`;
    } else {
      const { st, j, walkKm, walkMins: walkMinsToSt, inZone } = r;
      const walkToSt = Math.max(1, Math.round(walkMinsToSt));
      const journeyMins = personSettings[i].directOnly ? j.direct_mins : j.total_mins;
      const summary = (personSettings[i].directOnly ? j.direct_route : j.route_summary) || '';
      const steps = summary.split(' â†’ ').map(s =>
        `<div style="padding:1px 0 1px 8px;border-left:2px solid #ddd;color:#444;font-size:12px">${s}</div>`
      ).join('');
      const jMinZone = personSettings[i].directOnly ? j.direct_min_zone : j.min_zone;
      const jMaxZone = personSettings[i].directOnly ? j.direct_max_zone : j.max_zone;
      const mc = monthlyCost(jMinZone, jMaxZone);
      html += `<div style="color:#555;font-size:12px">Walk ~${walkToSt} min to ${cleanName(st.name)}</div>`;
      html += `<div style="margin:4px 0">${steps}</div>`;
      html += `<div style="color:#333;font-size:12px;font-weight:600">~${walkToSt + journeyMins} min total</div>`;
      if (mc) html += `<div style="color:#555;font-size:12px;margin-top:2px">~Â£${mc}/mo</div>`;
      if (!inZone) html += `<div style="color:#e65100;font-size:11px;margin-top:2px">Outside current time limit</div>`;
      if (nearestNoData.st && nearestNoData.dist < walkKm) {
        html += `<div style="color:#999;font-size:11px;margin-top:2px">Note: ${cleanName(nearestNoData.st.name)} is closer but has no route data</div>`;
      }
    }
    html += '</div>';
  }
  return html + '</div>';
}

map.on('click', function(e) {
  L.popup({ maxWidth: 360, autoPan: true })
    .setLatLng(e.latlng)
    .setContent(buildClickPopup(e.latlng))
    .openOn(map);
});

// â”€â”€ Job location markers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function jobMarkerIcon(color) {
  return L.divIcon({
    className: "",
    html: `<div style="background:${color};color:white;border-radius:50%;width:28px;height:28px;line-height:28px;text-align:center;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.4);font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">&#128188;</div>`,
    iconSize: [28, 28], iconAnchor: [14, 14],
  });
}
const jobMarkers = jobs.map(job => {
  const [lat, lon] = job.latlon.split(",").map(Number);
  return L.marker([lat, lon], { icon: jobMarkerIcon(job.color) })
    .bindPopup(job.label).addTo(map);
});

function onColor(i, color) {
  jobs[i].color = color;
  // Update tab button
  document.querySelectorAll(".tab-btn")[i].style.setProperty("--c", color);
  // Update slider accent if visible
  const slider = document.getElementById(`slider-${i}`);
  if (slider) slider.style.accentColor = color;
  // Update job location marker
  jobMarkers[i].setIcon(jobMarkerIcon(color));
  render();
}

buildPanel();
render();
</script>
